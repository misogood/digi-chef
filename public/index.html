<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Digitale Chef</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <header class="header">
            <h1>De Digitale Chef</h1>
            <p>Vraag me naar een recept of laat me ingrediënten omrekenen!</p>
        </header>
        
        <div id="chat-box" class="chat-box">
            <div class="bubble bot-bubble">Bonjour! Wat gaan we koken vandaag?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Stel een vraag over koken...">
            <button id="stuur-knop">Stuur</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
